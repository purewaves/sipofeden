<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Sip of Eden Admin</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FFEDD5 0%, #FDBA74 100%);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .offline-container {
      background-color: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
      max-width: 90%;
      width: 400px;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 1rem;
      object-fit: contain;
    }
    h1 {
      color: #2D3748;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }
    p {
      color: #718096;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .button {
      background-color: #FDBA74;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .button:hover {
      background-color: #F97316;
    }
    .icon {
      margin-bottom: 1rem;
      font-size: 3rem;
      color: #F97316;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="icon">📶</div>
    <h1>You're Offline</h1>
    <p>It seems you've lost your internet connection. The Sip of Eden Admin Dashboard requires an active internet connection to manage your store.</p>
    <p>Please check your connection and try again.</p>
    <a href="/admin" class="button">Try Again</a>
  </div>
</body>
</html>
